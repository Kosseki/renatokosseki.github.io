<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renato Kosseki | Portfólio</title>
    
    <!-- Link para os ícones (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- Configurações Gerais --- */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505; /* Fundo super escuro */
            color: white;
            overflow: hidden; /* Mantém tudo em uma tela */
        }

        /* --- Fundo Tecnológico (Circuitos e Binários) --- */
        /* Usaremos múltiplas imagens de fundo em SVG para criar o efeito */
        body {
            background-image: 
                /* 1. Efeito de Binários (embaixo, direita) */
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIj48dGV4dCB4PSIxMCIgeT0iMzAiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiIGZvbnQtZmFtaWx5PSJDb3VyaWVyIiBmb250LXNpemU9IjEyIj4wMTAxMTwvdGV4dD48dGV4dCB4PSIxMCIgeT0iMTAiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiIGZvbnQtZmFtaWx5PSJDb3VyaWVyIiBmb250LXNpemU9IjEyIj4xMTAwMDwvdGV4dD48L3N2Zz4='),
                /* 2. Efeito de Circuito (topo, direita) */
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCI+PHBhdGggZD0iTTUwIDEwIEw1MCA5MCBNMTAgNTAgTDkwIDUwIE0yMCAyMCBMODAgODAiIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwwLjA4KSIgc3Ryb2tlLXdpZHRoPSIwLjUiLz48L3N2Zz4=');
            background-position: bottom right, top right;
            background-repeat: repeat, no-repeat;
            background-size: 150px, 600px;
        }

        /* --- Barra de Navegação Superior --- */
        header {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            z-index: 10;
        }
        .menu-icon {
            font-size: 24px;
            color: #ff0055; /* Magenta/Rosa da referência */
            margin-right: 20px;
            cursor: pointer;
        }
        .brand-name {
            font-size: 22px;
            font-weight: bold;
        }

        /* --- Seção Principal (Hero) --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .welcome-text {
            color: #ff0055; /* Magenta/Rosa */
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .main-name {
            font-size: 64px;
            font-weight: 800;
            margin: 0;
            line-height: 1.1;
        }
        /* Ajuste para telas menores */
        @media (max-width: 768px) {
            .main-name { font-size: 40px; }
        }

        .titles-container {
            display: flex;
            align-items: center;
            margin-top: 15px;
            color: #ccc;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .title-item {
            padding: 0 15px;
        }
        .separator {
            color: #555;
            font-size: 18px;
        }

        /* --- Botão "Sobre Mim" --- */
        .btn-about {
            margin-top: 40px;
            padding: 12px 30px;
            border: 1px solid #555;
            background: transparent;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-about:hover {
            border-color: white;
            background-color: rgba(255,255,255,0.1);
        }

        /* --- Rodapé com Ícones --- */
        footer {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 30px;
            z-index: 10;
        }
        footer a {
            color: white;
            font-size: 28px;
            text-decoration: none;
            transition: color 0.3s ease, transform 0.2s ease;
        }
        footer a:hover {
            color: #ff0055; /* Magenta ao passar o mouse */
            transform: scale(1.1);
        }

    </style>
</head>
<body>

    <!-- Header Superior -->
    <header>
        <i class="fas fa-bars menu-icon"></i>
        <div class="brand-name">Renato</div>
    </header>

    <!-- Seção Hero Principal -->
    <main class="hero">
        <div class="welcome-text">Olá, seja bem vindo!</div>
        <h1 class="main-name">Eu sou<br>Renato Kosseki</h1>
        
        <div class="titles-container">
            <!-- Adicionei as barras verticais separando os itens -->
            <span class="separator">|</span>
            <span class="title-item">Desenvolvedor Full Stack</span>
            <span class="separator">|</span>
            <span class="title-item">Entusiasta de IA</span>
            <span class="separator">|</span>
            <span class="title-item">Analista de Dados</span>
            <span class="separator">|</span>
        </div>

        <!-- Botão vazado com ícone de seta -->
        <button class="btn-about">
            Sobre Mim <i class="fas fa-chevron-down"></i>
        </button>
    </main>

    <!-- Rodapé de Contatos -->
    <footer>
        <!-- INSIRA SEUS LINKS REAIS ABAIXO, ONDE DIZ "SEU-LINK-AQUI" -->
        
        <!-- E-mail (mailto:) -->
        <a href="mailto:seu-email@exemplo.com" title="Enviar E-mail">
            <i class="fas fa-envelope"></i>
        </a>
        
        <!-- GitHub -->
        <a href="https://github.com/Kosseki" target="_blank" title="Meu GitHub">
            <i class="fab fa-github"></i>
        </a>
        
        <!-- LinkedIn -->
        <a href="https://www.linkedin.com/in/SEU-PERFIL-AQUI" target="_blank" title="Meu LinkedIn">
            <i class="fab fa-linkedin-in"></i>
        </a>
    </footer>

</body>
</html>
